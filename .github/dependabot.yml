version: 2

updates:
  # Pinned Python dependencies in requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
